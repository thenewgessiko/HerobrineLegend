# HerobrineLegend 0.4.0 - atmospheric horror prototype
horror:
  enabled: true
  fear:
    enabled: true
    max-level: 100
    decay-per-minute: 1
    blindness-threshold: 70
    brief-blindness: true
    triggers:
      see-herobrine: 15
      attack: 20
      hallucination: 5
  effects:
    spawn-sound: true
    spawn-particles: true
  hallucinations:
    interval-seconds: 10
    chance-percent: 20.0
    phantom-footsteps: true
    heartbeat: true
    breath-effect: true
    distant-sounds: true

# HerobrineLegend 0.3.1
# Danno espresso in punti vita: 4.0 = 2 cuori completi.
herobrine:
  combat:
    # Probabilità che un'apparizione casuale diventi un attacco.
    # Combattimento sbloccato a 100 paura; termina sotto 70.
    hostile-at-fear: 100
    calm-below-fear: 70
    attack-chance-percent: 25.0
    damage: 4.0
    attack-cooldown-seconds: 1.0
    chase-speed: 0.28

  stalking:
    enabled: true
    min-distance: 10.0
    max-distance: 30.0
    check-interval-ticks: 40
    appearance-chance-percent: 25.0
    vanish-when-looked-at: true

  appearance:
    # Il modello usato è un player NPC PacketEvents, non uno zombie.
    normal-player-arms: true
    skin:
      texture-value: ''
      signature: ''

ritual:
  enabled: true
  activation-item: CRYING_OBSIDIAN
  deactivation-item: DIAMOND
  center-block: MOSSY_COBBLESTONE
  ring-block: GOLD_BLOCK
  side-redstone: REDSTONE_WIRE
  top-block: NETHERRACK

world:
  change-time: false
  change-weather: false
  generate-structures: false
